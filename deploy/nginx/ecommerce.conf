# ==============================================================================
# 电商运营助手 (Ecommerce Operation Assistant) - 生产级 Nginx 反向代理与静态托管配置
# ==============================================================================

# WebSocket / SSE 升级协议映射（必须位于 http 块级作用域）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP 流量强制全量 301 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # 生产环境请替换为真实域名，例如: assistant.example.com

    # ACME 挑战验证目录（Let's Encrypt Certbot 续期专用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 其余所有 HTTP 请求永久重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 安全服务核心配置
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 启用 HTTP/2 支持（新版 Nginx 1.25.1+ 支持 http2 on; 兼容旧版可写为: listen 443 ssl http2;）
    http2 on;

    server_name localhost; # 生产环境请替换为真实域名

    # --------------------------------------------------------------------------
    # SSL/TLS 证书及加密套件配置
    # --------------------------------------------------------------------------
    # 证书公钥与私钥的标准存放路径
    ssl_certificate /etc/nginx/ssl/ecommerce.crt;
    ssl_certificate_key /etc/nginx/ssl/ecommerce.key;

    # 协议版本控制：仅允许现代安全协议 TLS 1.2 与 TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL 会话复用优化（降低重复握手延迟）
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # 生产级安全响应头 (Security Headers)
    # --------------------------------------------------------------------------
    # 强制客户端浏览器在后续 1 年内仅使用 HTTPS 访问
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 防止 MIME 类型混淆嗅探攻击
    add_header X-Content-Type-Options nosniff always;
    # 防止点击劫持（仅允许同源嵌入）
    add_header X-Frame-Options SAMEORIGIN always;
    # 启用 XSS 过滤防护
    add_header X-XSS-Protection "1; mode=block" always;
    # 保护来源 Referrer 隐私
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Gzip 静态文本压缩配置
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # 前端静态资源托管 (Vite/React 构建产物 SPA History 路由)
    # --------------------------------------------------------------------------
    root /home/ubuntu/projects/ecommerce_operation_assistant/frontend/dist;
    index index.html;

    # 客户端静态文件单页路由重定向机制
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 强缓存规则：对带有 Hash 指纹的静态资源设置长期缓存 (30天)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 入口禁止强缓存，保证前端版本发布后即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # 后端 API 反向代理 (FastAPI 服务: http://127.0.0.1:8001)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;

        # HTTP/1.1 与 WebSocket / SSE 升级协议支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 传递真实客户端网络信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 传递安全协议标志：FastAPI 据此判断为 HTTPS 从而合法下发 HttpOnly + Secure Cookie
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # 超时设置（针对大模型生成、流式响应优化）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 关闭代理缓冲，保证 AI 对话 SSE (Server-Sent Events) 流式推送实时直达浏览器
        proxy_buffering off;
        proxy_cache off;
    }

    # --------------------------------------------------------------------------
    # 错误页面与日志配置
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/ecommerce_access.log;
    error_log /var/log/nginx/ecommerce_error.log warn;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
